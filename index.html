<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>ハングルタイピング練習</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f4f8;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      margin: 0;
      padding: 8px;
      overflow: hidden;
      position: relative;
    }

    .card {
      background: #ffffff;
      padding: 16px 14px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 380px;
      text-align: center;
      position: relative;
    }

    /* ヘッダー＆ハンバーガーボタン */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.1rem; color: #2f5496; margin: 0; }
    
    .hamburger-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px;
      color: #2f5496;
    }

    /* 問題表示エリア */
    .question-box {
      background: #eef2f7;
      border-radius: 12px;
      padding: 12px 10px;
      margin-bottom: 12px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .romaji-large {
      font-size: 2.5rem;
      font-weight: bold;
      color: #1e3a70;
      margin: 2px 0;
      line-height: 1.1;
    }
    
    .pronounce-hint {
      font-size: 0.85rem;
      color: #555;
      margin-top: 4px;
    }

    .key-hint {
      display: inline-block;
      background: #ffffff;
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid #2f5496;
      font-size: 0.75rem;
      color: #2f5496;
      font-weight: bold;
      margin-top: 6px;
    }

    .action-btns {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .btn-action {
      background: #ffc000;
      color: #000;
      border: none;
      padding: 4px 12px;
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .btn-audio { background: #4472c4; color: #fff; }

    .revealed-answer {
      font-size: 1.8rem;
      font-weight: bold;
      color: #c55a11;
      margin-top: 4px;
      display: none;
    }

    /* 入力・結果エリア */
    input[type="text"] {
      width: 85%;
      font-size: 1.6rem;
      text-align: center;
      padding: 6px;
      border: 2px solid #ccc;
      border-radius: 10px;
      outline: none;
      margin: 0 auto 6px auto;
    }
    input[type="text"]:focus { border-color: #2f5496; }

    .feedback { font-weight: bold; font-size: 1rem; min-height: 22px; margin-bottom: 4px; }
    .correct { color: #2e7d32; }

    .sub-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: #666;
      margin-top: 6px;
    }
    .btn-order {
      background: #f2f2f2;
      border: 1px solid #ccc;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.72rem;
    }

    /* --------------------------------------------------
       ハンバーガーサイドメニュー（ドロワー）
       -------------------------------------------------- */
    .menu-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vvh;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 100;
    }
    .menu-overlay.open { display: block; }

    .menu-content {
      position: fixed;
      top: 0; right: -280px;
      width: 280px; height: 100dvh;
      background: #ffffff;
      box-shadow: -4px 0 15px rgba(0,0,0,0.15);
      transition: right 0.3s ease;
      z-index: 101;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .menu-content.open { right: 0; }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #2f5496;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
    .menu-title { font-size: 1.1rem; font-weight: bold; color: #2f5496; }
    .close-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; }

    .menu-section {
      margin-bottom: 20px;
      text-align: left;
    }
    .section-label {
      font-size: 0.82rem;
      font-weight: bold;
      color: #777;
      margin-bottom: 8px;
      text-transform: uppercase;
      border-left: 3px solid #2f5496;
      padding-left: 6px;
    }

    /* モード選択リスト */
    .mode-option {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      border-radius: 8px;
      background: #f8f9fa;
      margin-bottom: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      border: 1px solid #e9ecef;
    }
    .mode-option.active {
      background: #e2efda;
      border-color: #a8d08d;
      font-weight: bold;
      color: #375623;
    }
    .mode-option .check-mark {
      margin-left: auto;
      font-weight: bold;
      color: #2e7d32;
    }

    /* 設定チェックボックス（トグル） */
    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 0.85rem;
      border-bottom: 1px dashed #eee;
    }
    .setting-item input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: #2f5496;
      cursor: pointer;
    }

    .btn-csv-import {
      width: 100%;
      background: #2f5496;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      margin-top: 6px;
    }

    /* キーボード起動時超コンパクトスタイル */
    body.is-keyboard-open { align-items: flex-start; padding-top: 4px; }
    body.is-keyboard-open .card { padding: 10px; }
    body.is-keyboard-open .romaji-large { font-size: 1.8rem; }
    body.is-keyboard-open .question-box { min-height: 90px; padding: 6px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>🇰🇷 ハングルタイピング</h1>
      <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
    </div>

    <div class="question-box">
      <div style="font-size: 0.7rem; color: #777;">【問題】</div>
      <div class="romaji-large" id="romajiText">ga</div>
      <div class="pronounce-hint" id="pronounceHint">発音: カ (a)</div>
      <div class="key-hint" id="keyHint">キー: r + k</div>

      <div class="action-btns">
        <button class="btn-action" id="btnReveal" onclick="revealAnswer()">👁️ 答えを見る</button>
        <button class="btn-action btn-audio" id="btnAudio" onclick="playAudio()">🔊 発音を聞く</button>
      </div>
      <div class="revealed-answer" id="revealedAnswer">가</div>
    </div>

    <div class="feedback" id="feedback"></div>

    <input type="text" id="userInput" placeholder="ハングル入力" autocomplete="off">
    
    <div class="sub-controls">
      <button class="btn-order" onclick="toggleOrder()" id="orderBtn">順序通り</button>
      <div>進捗: <span id="progress">1</span> / <span id="maxProgress">140</span> (正解: <span id="score">0</span>)</div>
    </div>
  </div>

  <!-- ハンバーガーメニュー (スライドオーバーレイ) -->
  <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
  <div class="menu-content" id="menuContent">
    <div class="menu-header">
      <div class="menu-title">メニュー＆設定</div>
      <button class="close-btn" onclick="toggleMenu()">✕</button>
    </div>

    <!-- モード選択 -->
    <div class="menu-section">
      <div class="section-label">モード選択</div>
      <div class="mode-option" id="modeOpt1" onclick="changeMode(1)">
        1. 140音組合せ
        <span class="check-mark" id="check1">✔</span>
      </div>
      <div class="mode-option" id="modeOpt2" onclick="changeMode(2)">
        2. 基本単語
        <span class="check-mark" id="check2" style="display:none;">✔</span>
      </div>
      <div class="mode-option" id="modeOpt3" onclick="changeMode(3)">
        3. 会話フレーズ
        <span class="check-mark" id="check3" style="display:none;">✔</span>
      </div>
    </div>

    <!-- Setting (表示・非表示) -->
    <div class="menu-section">
      <div class="section-label">表示設定 (Setting)</div>
      <div class="setting-item">
        <span>🔊 発音ヒント表示</span>
        <input type="checkbox" id="setPronounce" checked onchange="updateSettings()">
      </div>
      <div class="setting-item">
        <span>⌨️ 英語配列キー表示</span>
        <input type="checkbox" id="setKeyHint" checked onchange="updateSettings()">
      </div>
      <div class="setting-item">
        <span>👁️ 「答えを見る」ボタン</span>
        <input type="checkbox" id="setRevealBtn" checked onchange="updateSettings()">
      </div>
      <div class="setting-item">
        <span>🔊 「発音を聞く」ボタン</span>
        <input type="checkbox" id="setAudioBtn" checked onchange="updateSettings()">
      </div>
    </div>

    <!-- CSVファイル取込 -->
    <div class="menu-section">
      <div class="section-label">データ管理</div>
      <label class="btn-csv-import">
        📁 CSVファイルの取込
        <input type="file" id="csvFileInput" accept=".csv" style="display:none;" onchange="handleCSVUpload(event)">
      </label>
    </div>
  </div>

  <script>
    // 140音データ自動生成用インデックス
    const consData = [
      { char: 'ㄱ', key: 'r', rom: 'g/k', name: 'カ行' }, { char: 'ㄴ', key: 's', rom: 'n', name: 'ナ行' },
      { char: 'ㄷ', key: 'e', rom: 'd/t', name: 'タ行' }, { char: 'ㄹ', key: 'f', rom: 'r/l', name: 'ラ行' },
      { char: 'ㅁ', key: 'a', rom: 'm', name: 'マ行' }, { char: 'ㅂ', key: 'q', rom: 'b/p', name: 'パ行' },
      { char: 'ㅅ', key: 't', rom: 's', name: 'サ行' }, { char: 'ㅇ', key: 'd', rom: '-', name: 'ア行(無音)' },
      { char: 'ㅈ', key: 'w', rom: 'j/ch', name: 'チャ行' }, { char: 'ㅊ', key: 'c', rom: "ch'", name: '激音チャ' },
      { char: 'ㅋ', key: 'z', rom: "k'", name: '激音カ' }, { char: 'ㅌ', key: 'x', rom: "t'", name: '激音タ' },
      { char: 'ㅍ', key: 'v', rom: "p'", name: '激音パ' }, { char: 'ㅎ', key: 'g', rom: 'h', name: 'ハ行' }
    ];
    const vowelData = [
      { key: 'k', rom: 'a', hint: 'ア' }, { key: 'i', rom: 'ya', hint: 'ヤ' },
      { key: 'j', rom: 'eo', hint: '広いオ' }, { key: 'u', rom: 'yeo', hint: '広いヨ' },
      { key: 'h', rom: 'o', hint: '丸めるオ' }, { key: 'y', rom: 'yo', hint: '丸めるヨ' },
      { key: 'n', rom: 'u', hint: '丸めるウ' }, { key: 'b', rom: 'yu', hint: '丸めるユ' },
      { key: 'm', rom: 'eu', hint: '平らなウ' }, { key: 'l', rom: 'i', hint: 'イ' }
    ];

    const cJamoIndices = [0, 2, 3, 5, 6, 7, 9, 11, 12, 14, 15, 16, 17, 18];
    const vJamoIndices = [0, 2, 4, 6, 8, 12, 13, 14, 18, 20];

    const builtinMode1 = [];
    for (let c = 0; c < consData.length; c++) {
      for (let v = 0; v < vowelData.length; v++) {
        const charCode = 0xAC00 + (cJamoIndices[c] * 21 + vJamoIndices[v]) * 28;
        const hangul = String.fromCharCode(charCode);
        const cObj = consData[c];
        const vObj = vowelData[v];
        builtinMode1.push({
          mode: '1',
          target: hangul,
          romaji: `${cObj.rom === '-' ? '' : cObj.rom}${vObj.rom}`,
          hint: `発音: 【${cObj.name}】 ＋ 【${vObj.hint}】`,
          key: `キー: ${cObj.key} + ${vObj.key}`
        });
      }
    }

    const builtinMode2 = [
      { mode: '2', target: "우유", romaji: "u - yu", hint: "【意味】牛乳", key: "キー: n + b" },
      { mode: '2', target: "고기", romaji: "go - gi", hint: "【意味】お肉", key: "キー: rh + rl" },
      { mode: '2', target: "나무", romaji: "na - mu", hint: "【意味】木", key: "キー: sk + an" },
      { mode: '2', target: "바다", romaji: "ba - da", hint: "【意味】海", key: "キー: qk + ek" },
      { mode: '2', target: "사과", romaji: "sa - gwa", hint: "【意味】りんご", key: "キー: tk + rhk" }
    ];

    const builtinMode3 = [
      { mode: '3', target: "안녕하세요", romaji: "an - nyeong - ha - se - yo", hint: "【意味】こんにちは", key: "キー: dks + sud + ghk + tp + dy" },
      { mode: '3', target: "감사합니다", romaji: "gam - sa - ham - ni - da", hint: "【意味】ありがとうございます", key: "キー: rka + tk + gka + sl + ek" },
      { mode: '3', target: "죄송합니다", romaji: "joe - song - ham - ni - da", hint: "【意味】ごめんなさい", key: "キー: thl + thd + gka + sl + ek" }
    ];

    let csvStore = [];
    let currentMode = 1;
    let currentDataList = builtinMode1;
    let currentIndex = 0;
    let score = 0;
    let isRandom = false;

    // UI要素
    const romajiTextEl = document.getElementById('romajiText');
    const pronounceHintEl = document.getElementById('pronounceHint');
    const keyHintEl = document.getElementById('keyHint');
    const revealedAnswerEl = document.getElementById('revealedAnswer');
    const userInputEl = document.getElementById('userInput');
    const feedbackEl = document.getElementById('feedback');
    const scoreEl = document.getElementById('score');
    const progressEl = document.getElementById('progress');
    const maxProgressEl = document.getElementById('maxProgress');

    // キーボード連動
    userInputEl.addEventListener('focus', () => document.body.classList.add('is-keyboard-open'));
    userInputEl.addEventListener('blur', () => document.body.classList.remove('is-keyboard-open'));

    // ハンバーガーメニュー開閉
    function toggleMenu() {
      document.getElementById('menuOverlay').classList.toggle('open');
      document.getElementById('menuContent').classList.toggle('open');
    }

    // 設定（表示/非表示）の更新＆保存
    function updateSettings() {
      const showPronounce = document.getElementById('setPronounce').checked;
      const showKey = document.getElementById('setKeyHint').checked;
      const showReveal = document.getElementById('setRevealBtn').checked;
      const showAudio = document.getElementById('setAudioBtn').checked;

      pronounceHintEl.style.display = showPronounce ? 'block' : 'none';
      keyHintEl.style.display = showKey ? 'inline-block' : 'none';
      document.getElementById('btnReveal').style.display = showReveal ? 'inline-block' : 'none';
      document.getElementById('btnAudio').style.display = showAudio ? 'inline-block' : 'none';

      // 保存
      const settings = { showPronounce, showKey, showReveal, showAudio };
      localStorage.setItem('hangul_app_settings', JSON.stringify(settings));
    }

    function loadSettings() {
      const saved = localStorage.getItem('hangul_app_settings');
      if (saved) {
        const s = JSON.parse(saved);
        document.getElementById('setPronounce').checked = s.showPronounce;
        document.getElementById('setKeyHint').checked = s.showKey;
        document.getElementById('setRevealBtn').checked = s.showReveal;
        document.getElementById('setAudioBtn').checked = s.showAudio;
      }
      updateSettings();
    }

    // 音声再生
    function playAudio() {
      const targetText = currentDataList[currentIndex].target;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const uttr = new SpeechSynthesisUtterance(targetText);
        uttr.lang = 'ko-KR';
        uttr.rate = 0.85;
        window.speechSynthesis.speak(uttr);
      }
    }

    function loadQuestion() {
      if (!currentDataList || currentDataList.length === 0) return;
      const item = currentDataList[currentIndex];
      romajiTextEl.textContent = item.romaji;
      pronounceHintEl.textContent = item.hint;
      keyHintEl.textContent = item.key;
      revealedAnswerEl.textContent = item.target;
      revealedAnswerEl.style.display = 'none';

      userInputEl.value = '';
      feedbackEl.textContent = '';
      progressEl.textContent = currentIndex + 1;
      maxProgressEl.textContent = currentDataList.length;
    }

    function revealAnswer() {
      revealedAnswerEl.style.display = 'block';
      playAudio();
    }

    userInputEl.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      const currentItem = currentDataList[currentIndex];
      
      if (val === currentItem.target) {
        feedbackEl.textContent = '⭕ 正解！';
        feedbackEl.className = 'feedback correct';
        playAudio();
        score++;
        scoreEl.textContent = score;
        setTimeout(nextQuestion, 450);
      }
    });

    function nextQuestion() {
      if (isRandom) currentIndex = Math.floor(Math.random() * currentDataList.length);
      else currentIndex = (currentIndex + 1) % currentDataList.length;
      loadQuestion();
    }

    function changeMode(mode) {
      currentMode = mode;
      
      // UI更新 (チェックマーク)
      for (let i = 1; i <= 3; i++) {
        const opt = document.getElementById(`modeOpt${i}`);
        const chk = document.getElementById(`check${i}`);
        if (i === mode) {
          opt.classList.add('active');
          chk.style.display = 'inline';
        } else {
          opt.classList.remove('active');
          chk.style.display = 'none';
        }
      }

      if (csvStore.length > 0) {
        const filtered = csvStore.filter(item => String(item.mode).trim() === String(mode));
        currentDataList = filtered.length > 0 ? filtered : getBuiltinModeData(mode);
      } else {
        currentDataList = getBuiltinModeData(mode);
      }
      resetQuiz();
    }

    function getBuiltinModeData(mode) {
      if (mode === 1) return builtinMode1;
      if (mode === 2) return builtinMode2;
      if (mode === 3) return builtinMode3;
      return builtinMode1;
    }

    function parseAndApplyCSV(csvText, showAlert = true) {
      const lines = csvText.split('\n');
      const parsed = [];
      
      lines.forEach((line, idx) => {
        const parts = line.split(',');
        if (parts.length >= 3) {
          const m = parts[0].trim();
          if (idx === 0 && (m.includes('モード') || m.includes('Mode'))) return;
          
          parsed.push({
            mode: m,
            target: parts[1].trim(),
            romaji: parts[2].trim(),
            hint: parts[3] ? parts[3].trim() : '',
            key: parts[4] ? parts[4].trim() : ''
          });
        }
      });

      if (parsed.length > 0) {
        csvStore = parsed;
        if (showAlert) {
          alert(`全 ${parsed.length} 件のデータを読み込み、自動保存しました！`);
          toggleMenu(); // メニューを閉じる
        }
        changeMode(currentMode);
      }
    }

    function handleCSVUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const text = evt.target.result;
        localStorage.setItem('hangul_custom_csv_data', text);
        parseAndApplyCSV(text, true);
      };
      reader.readAsText(file, 'UTF-8');
    }

    function toggleOrder() {
      isRandom = !isRandom;
      document.getElementById('orderBtn').textContent = isRandom ? 'ランダム' : '順序通り';
      nextQuestion();
    }

    function resetQuiz() {
      currentIndex = 0;
      score = 0;
      scoreEl.textContent = score;
      loadQuestion();
    }

    function init() {
      loadSettings();
      const savedData = localStorage.getItem('hangul_custom_csv_data');
      if (savedData) {
        parseAndApplyCSV(savedData, false);
      } else {
        loadQuestion();
      }
    }

    init();
  </script>
</body>
</html>
